<ul class="list-group">

    @for (title of titles(); track $index) {

        @let isSelected = title.selected;
        <li class="list-group-item"
            role="button"
            [class.active]="isSelected"
            (click)="titleClick(title.id)">
            <div class="d-flex align-items-center justify-content-between">
                <span>{{ title.name }}</span>

                @if (title.count > 0) {
                    <span   class="badge"
                            [title]="title.count + ' tasks left'"
                            [class.bg-secondary]="!isSelected"
                            [class.bg-info]="isSelected">{{ title.count }}</span>
                }
            </div>
        </li>

    }

</ul>
