<!-- Tags -->
<div class="d-flex align-items-center gap-1">

  @for (tag of tags; track $index) {

    <span class="badge rounded-pill bg-primary form-control"
          (click)="removeTag(tag)"
          (keydown.Enter)="removeTag(tag)"
          tabindex="0">{{tag}} <i class="bi bi-x"></i>
    </span>

  }

</div>

<!-- Input element -->
<input type="text"
       class="form-control"
       placeholder="Add a tag"
       (keydown)="addTag($event)"
       (input)="onInput($event)"
       list="tag-input-suggestions"/>

<!-- Datalist -->
<datalist id="tag-input-suggestions">

  @for (s of suggestions; track $index) {

    <option [value]="s + ' '"></option>

  }

</datalist>
